<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYKYO CLUB - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #F7F8FA;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #0F172A;
  }

  /* Subtle background gradients */
  .bg-scene {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(74,144,217,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, rgba(124,58,237,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 90%, rgba(124,58,237,0.05) 0%, transparent 50%),
      #F7F8FA;
  }

  /* Floating particles */
  .particle {
    position: fixed; pointer-events: none;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #7C3AED;
    animation: float-up linear infinite;
    opacity: 0;
  }
  @keyframes float-up {
    0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-10vh) translateX(var(--drift)); opacity: 0; }
  }

  /* Loading screen */
  #loadingScreen {
    display: flex;
    position: fixed; inset: 0; z-index: 200;
    background: #F7F8FA;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .load-spinner {
    width: 56px; height: 56px;
    border: 3px solid rgba(124,58,237,0.15);
    border-top-color: #7C3AED;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text {
    font-size: 1rem; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    background: linear-gradient(135deg, #4A90D9, #7C3AED);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .load-sub { font-size: 0.8rem; color: #64748B; }

  /* Wrapper */
  .login-wrapper {
    position: relative; z-index: 10;
    width: 100%; max-width: 380px;
    padding: 16px;
    animation: slideUp 0.7s cubic-bezier(0.16,1,0.3,1) both;
    max-height: 100vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(36px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── THE CARD ─── */
  .sk-card {
    position: relative;
    background: #FFFFFF;
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 24px;
    overflow: hidden;
    padding: 2rem 1.75rem 0;
    box-shadow: 0 20px 60px rgba(124,58,237,0.12), 0 4px 16px rgba(0,0,0,0.06);
  }

  /* Decorative blob — perfect circle, anchored bottom-right */
  .sk-blob {
    position: absolute;
    bottom: -70px; right: -70px;
    width: 200px; height: 200px;
    background: #C8B4E8;
    border-radius: 50%;
    opacity: 0.42;
    z-index: 0;
  }



  /* Logo — centered */
  .sk-logo {
    position: relative; z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-bottom: 1.75rem;
  }
  .sk-logo img {
    height: 46px; width: auto;
    display: block;
    object-fit: contain;
  }

  /* Headline */
  .sk-headline {
    position: relative; z-index: 1;
    margin-bottom: 0;
  }
  .sk-headline h2 {
    font-size: 20px; font-weight: 700;
    color: #0F172A; margin: 0; line-height: 1.2;
  }
  .sk-headline p {
    font-size: 12px; color: #64748B;
    margin: 0.35rem 0 0; font-weight: 400;
  }

  /* Form */
  .sk-form {
    position: relative; z-index: 1;
    margin-top: 1.4rem;
    display: flex; flex-direction: column; gap: 1rem;
  }

  /* Field */
  .sk-field { display: flex; flex-direction: column; gap: 4px; }
  .sk-field label {
    font-size: 10px; font-weight: 600;
    color: #64748B;
    letter-spacing: 0.8px; text-transform: uppercase;
  }
  .sk-fi {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1.5px solid rgba(0,0,0,0.14);
    padding: 7px 0;
    transition: border-color 0.2s;
  }
  .sk-fi:focus-within { border-bottom-color: #7C3AED; }
  .sk-fi:focus-within i { color: #7C3AED; }
  .sk-fi i {
    font-size: 15px; color: #94A3B8; flex-shrink: 0;
  }
  .sk-fi input {
    border: none !important; outline: none !important;
    background: transparent !important;
    box-shadow: none !important;
    font-family: 'Inter', sans-serif;
    font-size: 14px; color: #0F172A;
    flex: 1; padding: 0 !important; height: auto !important;
  }
  .sk-fi input::placeholder { color: #94A3B8; }

  /* Eye toggle */
  .sk-eye {
    background: none; border: none; cursor: pointer;
    padding: 0; color: #94A3B8; display: flex;
    transition: color 0.2s;
  }
  .sk-eye:hover { color: #7C3AED; }
  .sk-eye i { font-size: 15px; }

  /* Remember row */
  .remember-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: -0.35rem; cursor: pointer;
  }
  .remember-check {
    width: 16px; height: 16px;
    accent-color: #7C3AED; cursor: pointer; flex-shrink: 0;
  }
  .remember-label {
    font-size: 11px; color: #64748B;
    cursor: pointer; user-select: none;
  }

  /* Forgot */
  .sk-forgot {
    text-align: right; margin-top: -0.5rem;
  }
  .sk-forgot a {
    font-size: 11px; color: #7C3AED;
    text-decoration: none; font-weight: 500;
  }

  /* CTA Button */
  .btn-primary {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #4A90D9 0%, #7C3AED 100%);
    color: #fff; border: none; border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; margin-top: 0.25rem;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(124,58,237,0.30);
    position: relative; overflow: hidden;
  }
  .btn-primary::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
  }
  .btn-primary:hover::before { transform: translateX(100%); }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }

  /* Loading state inside button */
  .loading-state {
    display: none; align-items: center;
    justify-content: center; gap: 8px;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* Divider */
  .sk-div {
    display: flex; align-items: center; gap: 10px;
  }
  .sk-div span { font-size: 11px; color: #94A3B8; white-space: nowrap; }
  .sk-div::before, .sk-div::after {
    content: ''; flex: 1; height: 0.5px;
    background: rgba(0,0,0,0.1);
  }

  /* Social buttons */
  .sk-social { display: flex; gap: 10px; }
  .sk-sb {
    flex: 1; display: flex; align-items: center;
    justify-content: center; gap: 6px;
    padding: 9px; border-radius: 10px;
    border: 0.5px solid rgba(0,0,0,0.12);
    background: #F7F8FA; cursor: pointer;
    font-size: 12px; font-weight: 500;
    color: #475569; font-family: 'Inter', sans-serif;
    transition: background 0.15s;
  }
  .sk-sb:hover { background: #EEF0F3; }
  .sk-sb i { font-size: 15px; }

  /* Bottom section */
  .sk-bottom {
    position: relative; z-index: 1;
    margin-top: 1.25rem;
  }

  /* Coaches centered */
  .sk-coaches {
    display: flex;
    justify-content: center;
  }
  .sk-coaches img {
    height: 160px; width: auto; display: block;
    object-fit: contain;
    filter: drop-shadow(0 -6px 14px rgba(124,58,237,0.22));
  }

  /* Credits */
  .sk-credits {
    position: relative; z-index: 1;
    text-align: center;
    font-size: 11px; color: #94A3B8;
    padding: 0.5rem 0 1.2rem;
  }
  .sk-credits strong { color: #7C3AED; }

  /* Sotelo badge */
  .sotelo-badge {
    display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(15,23,42,0.06);
    border: 1px solid rgba(0,0,0,0.07);
    transition: all 0.3s ease;
    margin-top: 6px;
  }
  .sotelo-badge:hover {
    background: rgba(124,58,237,0.08);
    border-color: rgba(124,58,237,0.25);
    transform: translateY(-1px);
  }
  .sotelo-label { font-size: 0.65rem; color: #94A3B8; letter-spacing: 0.3px; }
  .sotelo-wordmark {
    font-family: 'Georgia', serif;
    font-size: 0.95rem; font-weight: 400;
    letter-spacing: 1.5px; color: #475569;
  }
  .sotelo-wordmark .t-letter {
    background: linear-gradient(160deg, #4A90D9, #7C3AED);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-style: italic;
  }



  @media (max-width: 420px) {
    .sk-card { padding: 1.75rem 1.25rem 0; }
    .sk-headline h2 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="bg-scene"></div>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <div class="load-spinner"></div>
  <div class="load-text">Iniciando sesión…</div>
  <div class="load-sub">Por favor espera</div>
</div>

<!-- LOGIN CARD -->
<div class="login-wrapper" id="loginWrapper" style="display:none">
  <div class="sk-card">
    <div class="sk-blob"></div>

    <!-- Logo -->
    <div class="sk-logo">
      <img src="logo_saykyo.png" alt="Saykyo Club">
    </div>

    <!-- Headline -->
    <div class="sk-headline">
      <h2>Bienvenido de vuelta</h2>
      <p>Inicia sesión para continuar tu entrenamiento</p>
    </div>

    <!-- Form -->
    <form class="sk-form" id="loginForm" autocomplete="off">

      <!-- Email -->
      <div class="sk-field">
        <label>Correo electrónico</label>
        <div class="sk-fi">
          <i class="ti ti-mail" aria-hidden="true"></i>
          <input type="email" id="usuario" placeholder="tu@email.com" autocomplete="off" required>
        </div>
      </div>

      <!-- Password -->
      <div class="sk-field">
        <label>Contraseña</label>
        <div class="sk-fi">
          <i class="ti ti-lock" aria-hidden="true"></i>
          <input type="password" id="contrasena" placeholder="••••••••" required>
          <button type="button" class="sk-eye" id="eyeBtn" onclick="toggleEye()" aria-label="Mostrar contraseña">
            <i class="ti ti-eye" id="eyeIcon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Remember + Forgot -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:-0.25rem;">
        <label class="remember-row">
          <input type="checkbox" class="remember-check" id="rememberMe">
          <span class="remember-label">Recordarme</span>
        </label>
      </div>

      <!-- CTA -->
      <button type="submit" class="btn-primary" id="loginBtn">
        <span id="btnText">ENTRAR</span>
        <span class="loading-state" id="btnLoading">
          <span class="spinner"></span> Verificando...
        </span>
      </button>

    </form>

    <!-- Bottom: coaches + credits -->
    <div class="sk-bottom">
      <div class="sk-coaches">
        <img src="boss.png" alt="Entrenadores Saykyo">
      </div>
      <div class="sk-credits">
        By: <strong>Caro Muñoz</strong> y <strong>Sebas Moreno</strong><br>
        <a href="https://yhardanysotelo.github.io/" target="_blank" rel="noopener noreferrer" class="sotelo-badge" title="Diseñado por Sotelo">
          <span class="sotelo-label">Diseñado por</span>
          <span class="sotelo-wordmark">So<span class="t-letter">t</span>elo</span>
        </a>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDlQGoWTNtAna8unwVNgJZH8WNRsYF0MU",
  authDomain: "entrenamiento-6b069.firebaseapp.com",
  projectId: "entrenamiento-6b069",
  storageBucket: "entrenamiento-6b069.firebasestorage.app",
  messagingSenderId: "818051143570",
  appId: "1:818051143570:web:c17fa58f4f98ce67b9534b",
  databaseURL: "https://entrenamiento-6b069-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Eye toggle
window.toggleEye = () => {
  const inp  = document.getElementById('contrasena');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'ti ti-eye-off';
    document.getElementById('eyeBtn').title = 'Ocultar contraseña';
  } else {
    inp.type = 'password';
    icon.className = 'ti ti-eye';
    document.getElementById('eyeBtn').title = 'Ver contraseña';
  }
};

// Restore remembered credentials
const remembered = localStorage.getItem('saykyo_remember');
if (remembered) {
  try {
    const { email, password } = JSON.parse(remembered);
    document.getElementById('usuario').value    = email    || '';
    document.getElementById('contrasena').value = password || '';
    document.getElementById('rememberMe').checked = true;
  } catch(e) {}
}

// Floating particles
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random()*100}%;
    animation-duration: ${6+Math.random()*10}s;
    animation-delay: ${-Math.random()*16}s;
    --drift: ${(Math.random()-0.5)*80}px;
    width: ${1+Math.random()*2.5}px;
    height: ${1+Math.random()*2.5}px;
  `;
  document.body.appendChild(p);
}

// Bandera para evitar que onAuthStateChanged redirija mientras el formulario maneja el login
let loginEnProgreso = false;

// Check if already logged in
auth.onAuthStateChanged(async (user) => {
  if (user && !loginEnProgreso) {
    const snapshot = await get(ref(db, 'usuarios/' + user.uid));
    if (snapshot.exists()) {
      const userData = snapshot.val();
      sessionStorage.setItem('saykyo_user', JSON.stringify({ ...userData, uid: user.uid, id: user.uid }));
      if (userData.rol === 'admin' || userData.rol === 'superadmin') window.location.href = 'dashboard.html';
      else window.location.href = 'entrenamiento.html';
    }
  } else {
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginWrapper').style.display  = 'block';
  }
});

// Submit
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  loginEnProgreso = true;

  const email    = document.getElementById('usuario').value.trim();
  const password = document.getElementById('contrasena').value;

  document.getElementById('btnText').style.display    = 'none';
  document.getElementById('btnLoading').style.display = 'flex';

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    const snapshot = await get(ref(db, 'usuarios/' + user.uid));

    if (!snapshot.exists()) throw new Error("Usuario no configurado correctamente.");

    const userData = snapshot.val();

    if (!userData.activo) throw new Error("Tu cuenta está desactivada. Contacta a tu entrenador.");

    if (userData.validoHasta) {
      const [vy, vm, vd] = userData.validoHasta.split('-').map(Number);
      const valid = new Date(vy, vm - 1, vd, 23, 59, 59, 999);
      if (new Date() > valid) throw new Error("Tu suscripción ha vencido.");
    }

    if (document.getElementById('rememberMe').checked) {
      localStorage.setItem('saykyo_remember', JSON.stringify({ email, password }));
    } else {
      localStorage.removeItem('saykyo_remember');
    }

    sessionStorage.setItem('saykyo_user', JSON.stringify({ ...userData, uid: user.uid, id: user.uid }));

    await Swal.fire({
      icon: 'success',
      title: `¡Bienvenido(a), ${userData.nombres}!`,
      text: userData.rol === 'superadmin' ? 'Acceso Super Admin' : userData.rol === 'admin' ? 'Acceso de administrador' : 'Listo para entrenar',
      background: '#FFFFFF', color: '#0F172A',
      confirmButtonColor: '#7C3AED',
      timer: 1500, showConfirmButton: false,
      backdrop: 'rgba(15,23,42,0.4)'
    });

    if (userData.rol === 'admin' || userData.rol === 'superadmin') window.location.href = 'dashboard.html';
    else window.location.href = 'entrenamiento.html';

  } catch (err) {
    loginEnProgreso = false;
    document.getElementById('btnText').style.display    = '';
    document.getElementById('btnLoading').style.display = 'none';
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('loginWrapper').style.display  = 'block';

    let titulo = 'Acceso denegado';
    let mensaje = 'Ocurrió un error inesperado. Intenta de nuevo.';
    let icono   = 'error';

    const code = err.code || '';
    const msg  = err.message || '';

    if (msg === 'Tu cuenta está desactivada. Contacta a tu entrenador.') {
      titulo = 'Cuenta inactiva'; icono = 'warning';
      mensaje = 'Tu cuenta está desactivada. Comunícate con tu entrenador para reactivarla.';
    } else if (msg === 'Tu suscripción ha vencido.') {
      titulo = 'Membresía vencida'; icono = 'warning';
      mensaje = 'Tu suscripción ha expirado. Renueva tu membresía con tu entrenador para continuar.';
    } else if (msg === 'Usuario no configurado correctamente.') {
      titulo = 'Usuario no encontrado';
      mensaje = 'No encontramos tu perfil en el sistema. Contacta a tu entrenador.';
    } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-password') {
      titulo = 'Contraseña incorrecta';
      mensaje = 'La contraseña que ingresaste no es correcta. Verifica e intenta de nuevo.';
    } else if (code === 'auth/user-not-found' || code === 'auth/invalid-email') {
      titulo = 'Usuario no encontrado';
      mensaje = 'No existe una cuenta con ese correo. Verifica el email ingresado.';
    } else if (code === 'auth/too-many-requests') {
      titulo = 'Demasiados intentos'; icono = 'warning';
      mensaje = 'Bloqueamos temporalmente tu acceso por múltiples intentos fallidos. Espera unos minutos.';
    } else if (code === 'auth/network-request-failed') {
      titulo = 'Sin conexión'; icono = 'warning';
      mensaje = 'No hay conexión a internet. Verifica tu red e intenta de nuevo.';
    } else if (code === 'auth/user-disabled') {
      titulo = 'Cuenta deshabilitada'; icono = 'warning';
      mensaje = 'Tu cuenta fue deshabilitada. Contacta a tu entrenador.';
    }

    Swal.fire({
      icon: icono, title: titulo, text: mensaje,
      background: '#FFFFFF', color: '#0F172A',
      confirmButtonColor: '#7C3AED',
      backdrop: 'rgba(15,23,42,0.4)'
    });
  }
});
</script>
</body>
</html>
