<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYKYO CLUB — Tour Interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta idéntica a la de la app en claro */
  --p:#0077cc;--pd:#0055a5;--ac:#7c3aed;--su:#059669;
  --wa:#d97706;--er:#dc2626;--or:#ea580c;
  --tx:#0d1b2a;--mu:#5a6e84;--dm:#8ea4b8;
  --bg:#f2f4f8;--brd:rgba(0,85,165,.12);
  --card:#ffffff;--tint:#f5f9ff;--soft:#f0f4f9
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}

/* Fondo claro con el mismo lenguaje de luces del original, muy atenuado */
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 15% 35%,rgba(0,119,204,.07),transparent 55%),
             radial-gradient(ellipse at 85% 76%,rgba(124,58,237,.06),transparent 52%),
             radial-gradient(ellipse at 55% 5%,rgba(5,150,105,.04),transparent 42%),
             linear-gradient(180deg,#f7fafd 0%,#f2f4f8 60%,#eef2f7 100%)}
.grid{position:fixed;inset:0;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(0,85,165,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,85,165,.05) 1px,transparent 1px);
  background-size:44px 44px}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:od 10s ease-in-out infinite}
.o1{width:500px;height:500px;background:rgba(0,153,230,.10);top:-15%;left:-10%}
.o2{width:380px;height:380px;background:rgba(124,58,237,.08);bottom:5%;right:-8%;animation-delay:-4s}
@keyframes od{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-25px)}}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);
  border-bottom:1.5px solid var(--brd);box-shadow:0 2px 12px rgba(13,27,42,.05)}
.logo{font-family:'Space Mono',monospace;font-size:.95rem;font-weight:700;letter-spacing:4px;
  background:linear-gradient(135deg,var(--pd),var(--p),var(--ac));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.step-ctr{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--mu);letter-spacing:1px}
.close-btn{background:rgba(220,38,38,.08);border:1.5px solid rgba(220,38,38,.25);
  border-radius:10px;color:var(--er);font-family:'Exo 2',sans-serif;font-size:.78rem;
  font-weight:700;padding:6px 14px;cursor:pointer;transition:all .2s}
.close-btn:hover{background:rgba(220,38,38,.16)}

/* ── PROGRESS ── */
.prog-rail{position:fixed;top:53px;left:0;right:0;z-index:20;height:3px;background:rgba(0,85,165,.09)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--ac));
  border-radius:0 2px 2px 0;transition:width .55s cubic-bezier(.16,1,.3,1)}

/* ── SHELL ── */
#shell{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:74px 20px 140px}

/* ── SLIDE ── */
.slide{display:none;width:100%;max-width:680px;animation:sIn .45s cubic-bezier(.16,1,.3,1)}
.slide.active{display:block}
.slide.leaving{animation:sOut .28s ease forwards}
@keyframes sIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}

.card{
  background:var(--card);
  border:1px solid rgba(0,0,0,.07);border-radius:28px;
  padding:36px 34px 32px;position:relative;overflow:hidden;
  box-shadow:0 4px 16px rgba(13,27,42,.06),0 24px 60px rgba(13,27,42,.10);
  max-height:calc(100vh - 200px);overflow-y:auto
}
.card::-webkit-scrollbar{width:4px}
.card::-webkit-scrollbar-thumb{background:rgba(0,85,165,.22);border-radius:2px}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--cl,linear-gradient(90deg,transparent,var(--p),var(--ac),transparent))}
.cglow{position:absolute;top:-60px;right:-60px;width:220px;height:220px;
  background:var(--cg,radial-gradient(circle,rgba(0,119,204,.05),transparent 70%));pointer-events:none}

/* ── TYPOGRAPHY ── */
.stag{display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,119,204,.08);border:1px solid rgba(0,119,204,.2);
  border-radius:20px;padding:4px 12px;font-size:.66rem;color:var(--p);font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.sicon{font-size:2.8rem;margin-bottom:12px;line-height:1;color:var(--p);
  filter:drop-shadow(0 6px 14px rgba(0,119,204,.22));
  animation:ib .55s cubic-bezier(.34,1.56,.64,1) .08s both}
@keyframes ib{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.stitle{font-size:1.65rem;font-weight:900;line-height:1.2;margin-bottom:8px;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--tx) 0%,var(--pd) 60%,var(--p) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ssub{font-size:.9rem;color:var(--mu);line-height:1.65;margin-bottom:20px}
.ssub strong{color:var(--tx)}

/* ── STEPS ── */
.steps{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.step{display:flex;align-items:flex-start;gap:13px;
  background:var(--tint);border:1px solid var(--brd);
  border-radius:13px;padding:13px;
  animation:stIn .4s cubic-bezier(.16,1,.3,1) both}
@keyframes stIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.snum{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--pd),var(--p));border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:800;box-shadow:0 2px 8px rgba(0,119,204,.3)}
.sbody .sl{font-size:.88rem;font-weight:700;color:var(--tx);margin-bottom:2px}
.sbody .sd{font-size:.78rem;color:var(--mu);line-height:1.55}

/* ── CALLOUT ── */
.co{border-radius:13px;padding:11px 14px;display:flex;gap:10px;
  align-items:flex-start;margin:12px 0;font-size:.8rem;line-height:1.6;border-left-width:4px;border-left-style:solid}
.co strong{font-weight:800}
.co.info{background:#f0f9ff;border:1px solid rgba(0,153,230,.22);border-left-color:var(--p);color:#0b3f66}
.co.warn{background:#fffbeb;border:1px solid rgba(217,119,6,.22);border-left-color:var(--wa);color:#7c4a06}
.co.ok  {background:#f0fdf4;border:1px solid rgba(5,150,105,.22);border-left-color:var(--su);color:#0a5b40}
.co.bad {background:#fef2f2;border:1px solid rgba(220,38,38,.22);border-left-color:var(--er);color:#8f1d1d}

/* ── PILLS ── */
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;
  border-radius:20px;font-size:.75rem;font-weight:700;
  animation:pp .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pp{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.pc{background:rgba(0,119,204,.1);border:1px solid rgba(0,119,204,.25);color:var(--p)}
.pv{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);color:#6d28d9}
.pg{background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.25);color:var(--su)}
.po{background:rgba(234,88,12,.1);border:1px solid rgba(234,88,12,.25);color:var(--or)}
.pr{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);color:var(--er)}

/* ── MOCKUP ── */
.mockup{background:var(--card);border:1px solid var(--brd);
  border-radius:16px;overflow:hidden;margin:16px 0;box-shadow:0 6px 20px rgba(13,27,42,.08)}
.mbar{padding:8px 13px;background:#f6f9fc;border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:6px;font-size:.66rem;color:var(--mu);font-family:'Space Mono',monospace}
.mdot{width:7px;height:7px;border-radius:50%}
.mbody{padding:14px}
.mbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;
  border-radius:11px;font-size:.77rem;font-weight:800;font-family:'Exo 2',sans-serif}
.bprimary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 4px 14px rgba(0,119,204,.28)}
.bsuccess{background:linear-gradient(135deg,#065f46,var(--su));color:#fff;box-shadow:0 4px 14px rgba(5,150,105,.26)}
.bdanger{background:rgba(220,38,38,.09);border:1.5px solid rgba(220,38,38,.28);color:var(--er)}

.mrow{display:flex;gap:8px;margin-bottom:10px}
.mbox{flex:1;text-align:center;border-radius:10px;padding:9px}
.mbox.bp{background:rgba(0,119,204,.07);border:1px solid rgba(0,119,204,.2)}
.mbox.bg{background:rgba(5,150,105,.07);border:1px solid rgba(5,150,105,.2)}
.mval{font-size:1.25rem;font-weight:900;color:var(--p)}
.mval.g{color:var(--su)}
.mlbl{font-size:.62rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:700}

.mserie{display:flex;gap:7px;align-items:center;padding:8px;
  background:var(--tint);border:1px solid var(--brd);border-radius:10px;margin-bottom:6px}
.msn{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pd),var(--p));
  border:none;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0}
.msf{flex:1;height:29px;background:#fff;border:1.5px solid rgba(0,0,0,.12);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--tx)}
.msc{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.msc.done{background:var(--su);color:#fff;font-weight:900;box-shadow:0 3px 10px rgba(5,150,105,.35)}
.msc.empty{border:2px solid rgba(5,150,105,.3);color:rgba(5,150,105,.5);font-size:.75rem}

.mtoast{border:1.5px solid rgba(5,150,105,.3);border-radius:12px;padding:10px 13px;
  background:#f0fdf4;color:#0a5b40;display:flex;gap:9px;align-items:center;margin-bottom:9px;font-size:.8rem}
.mnotif{padding:11px;border-radius:12px;background:#f0f9ff;
  border:1px solid rgba(0,119,204,.2);margin-bottom:7px;position:relative;font-size:.8rem}
.mnotif::before{content:'';position:absolute;top:13px;left:-3px;
  width:6px;height:6px;border-radius:50%;background:var(--p);box-shadow:0 0 6px rgba(0,119,204,.6)}

.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}
.sbox{background:var(--tint);border:1px solid var(--brd);border-radius:12px;padding:11px;text-align:center}
.sv{font-size:1.3rem;font-weight:900;color:var(--p)}
.sk{font-size:.62rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;font-weight:700}
.chart{display:flex;align-items:flex-end;gap:5px;height:54px;padding:0 4px}
.cbar{flex:1;background:linear-gradient(0deg,var(--p),var(--ac));border-radius:3px 3px 0 0;min-height:3px}

.mtoggle{display:flex;align-items:center;gap:9px;padding:9px;
  background:var(--tint);border:1px solid var(--brd);border-radius:10px;margin-bottom:6px;font-size:.8rem}
.ttrack{width:34px;height:19px;border-radius:10px;position:relative;flex-shrink:0}
.ton{background:var(--p)}
.toff{background:rgba(0,0,0,.16)}
.tthumb{position:absolute;top:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ton .tthumb{left:17px}
.toff .tthumb{left:2.5px}

.tring{width:80px;height:80px;border-radius:50%;
  background:conic-gradient(var(--p) 62%,rgba(0,85,165,.1) 0);
  display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto 10px}
.tring::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--card)}
.trnum{position:relative;z-index:1;font-family:'Space Mono',monospace;font-size:1.35rem;font-weight:700;color:var(--p)}

.acard{border-radius:13px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:7px;font-size:.8rem}
.ac-r{background:#fef2f2;border:1px solid rgba(220,38,38,.22);color:#8f1d1d}
.ac-o{background:#fff7ed;border:1px solid rgba(234,88,12,.22);color:#9a3412}
.ac-y{background:#fffbeb;border:1px solid rgba(217,119,6,.22);color:#7c4a06}
.abadge{padding:3px 9px;border-radius:20px;font-size:.64rem;font-weight:800}

/* ── WELCOME GRID ── */
.wg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}
.wi{background:var(--tint);border:1px solid var(--brd);
  border-radius:13px;padding:13px;display:flex;align-items:center;gap:11px;
  animation:stIn .4s cubic-bezier(.16,1,.3,1) both;transition:.2s}
.wi:hover{background:#eaf4ff;border-color:rgba(0,119,204,.25);transform:translateY(-2px)}
.wico{font-size:1.5rem;flex-shrink:0;color:var(--p)}
.wlbl{font-size:.82rem;font-weight:700;color:var(--tx)}
.wdsc{font-size:.7rem;color:var(--mu);margin-top:2px}

/* ── DOTS ── */
.dots{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;gap:5px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(0,85,165,.2);
  cursor:pointer;transition:all .3s}
.dot:hover{background:rgba(0,85,165,.4)}
.dot.active{background:var(--p);width:22px;border-radius:4px;box-shadow:0 2px 8px rgba(0,119,204,.45)}
.dot.done{background:var(--su)}

/* ── NAV ── */
.navbtns{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;gap:11px;align-items:center}
.nbtn{padding:11px 26px;border-radius:13px;font-family:'Exo 2',sans-serif;
  font-size:.88rem;font-weight:700;cursor:pointer;border:none;
  letter-spacing:.5px;transition:all .25s;display:flex;align-items:center;gap:7px}
.nprev{background:var(--soft);border:1.5px solid rgba(0,0,0,.11);color:var(--mu)}
.nprev:hover{background:#e4eaf2;color:var(--tx)}
.nnext{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px rgba(0,119,204,.35)}
.nnext:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,119,204,.45)}
.nfinish{background:linear-gradient(135deg,#065f46,var(--su));color:#fff;font-weight:900;box-shadow:0 6px 20px rgba(5,150,105,.32)}
.nfinish:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(5,150,105,.42)}
.nbtn:disabled{opacity:.4;cursor:default;transform:none!important;box-shadow:none!important}

/* ── ACCESIBILIDAD ── */
:focus-visible{outline:3px solid rgba(0,153,230,.6);outline-offset:3px;border-radius:10px}
::selection{background:rgba(0,153,230,.2);color:var(--tx)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

@media(max-width:580px){
  .card{padding:24px 18px 20px;border-radius:20px}
  .stitle{font-size:1.3rem}
  .wg{grid-template-columns:1fr}
  .topbar{padding:12px 16px}
  #shell{padding:68px 12px 138px}
  .nbtn{padding:11px 20px;font-size:.84rem}
}

</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="orb o1"></div><div class="orb o2"></div>

<div class="topbar">
  <div class="logo">SAYKYO</div>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="step-ctr" id="ctr">1 / 1</span>
    <button class="close-btn" id="closeBtn">✕ Salir</button>
  </div>
</div>
<div class="prog-rail"><div class="prog-fill" id="pf"></div></div>

<div id="shell"><div id="wrap" style="width:100%;max-width:680px"></div></div>

<div class="dots" id="dots"></div>
<div class="navbtns">
  <button class="nbtn nprev" id="prevBtn" onclick="nav(-1)">← Anterior</button>
  <button class="nbtn nnext" id="nextBtn" onclick="nav(1)">→ Siguiente</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyCDlQGoWTNtAna8unwVNgJZH8WNRsYF0MU",
  authDomain:"entrenamiento-6b069.firebaseapp.com",
  databaseURL:"https://entrenamiento-6b069-default-rtdb.firebaseio.com"
});
const auth = getAuth(app);
const db = getDatabase(app);

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = 'index.html'; return; }
  const snap = await get(ref(db, `usuarios/${user.uid}`));
  if (!snap.exists()) { location.href = 'index.html'; return; }
  const u = { ...snap.val(), uid: user.uid };
  const isAdmin = u.rol === 'admin' || u.rol === 'superadmin';
  document.getElementById('closeBtn').onclick = () => location.href = isAdmin ? 'dashboard.html' : 'entrenamiento.html';
  init(u, isAdmin);
});

let slides = [], cur = 0;

function init(u, isAdmin) {
  slides = isAdmin ? adminSlides(u) : userSlides(u);
  document.getElementById('wrap').innerHTML = slides.map((s,i) =>
    `<div class="slide" id="s${i}"><div class="card" style="--cl:${s.cl||'linear-gradient(90deg,transparent,var(--p),var(--ac),transparent)'};--cg:${s.cg||'radial-gradient(circle,rgba(0,119,204,.06),transparent 70%)'}"><div class="cglow"></div>${s.h}</div></div>`
  ).join('');
  document.getElementById('dots').innerHTML = slides.map((_,i) =>
    `<div class="dot" id="d${i}" onclick="goTo(${i})"></div>`
  ).join('');
  goTo(0);
}

window.nav = d => goTo(cur + d);

window.goTo = function(idx) {
  if (idx < 0 || idx >= slides.length) return;
  const old = document.getElementById(`s${cur}`);
  if (old?.classList.contains('active')) {
    old.classList.add('leaving');
    setTimeout(() => old.classList.remove('active','leaving'), 260);
  } else old?.classList.remove('active');
  cur = idx;
  setTimeout(() => document.getElementById(`s${cur}`)?.classList.add('active'), old?.classList.contains('leaving') ? 180 : 0);

  const pct = slides.length > 1 ? (cur/(slides.length-1))*100 : 100;
  document.getElementById('pf').style.width = pct + '%';
  document.getElementById('ctr').textContent = `${cur+1} / ${slides.length}`;
  document.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('active', i===cur);
    d.classList.toggle('done', i<cur);
  });
  document.getElementById('prevBtn').disabled = cur === 0;
  const nb = document.getElementById('nextBtn');
  if (cur === slides.length-1) {
    nb.className = 'nbtn nfinish'; nb.innerHTML = '✓ ¡Listo!';
    nb.onclick = () => document.getElementById('closeBtn').click();
  } else {
    nb.className = 'nbtn nnext'; nb.innerHTML = '→ Siguiente';
    nb.onclick = () => nav(1);
  }
  setTimeout(() => {
    document.querySelectorAll(`#s${cur} .step`).forEach((el,i) => el.style.animationDelay = `${i*.07}s`);
    document.querySelectorAll(`#s${cur} .pill`).forEach((el,i) => el.style.animationDelay = `${i*.05}s`);
    document.querySelectorAll(`#s${cur} .wi`).forEach((el,i) => el.style.animationDelay = `${i*.06}s`);
  }, 50);
};

/* ════════════════════════════════════════
   USER SLIDES
════════════════════════════════════════ */
function userSlides(u) {
  const n = u.nombres||'Atleta', m = u.metodo||'RPE';
  return [
  { cl:'linear-gradient(90deg,transparent,var(--p),var(--ac),transparent)', h:`
    <div class="stag">Manual · Atleta</div>
    <div class="sicon"><svg class="ico" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.14em;flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
    <div class="stitle">Hola, ${n}!</div>
